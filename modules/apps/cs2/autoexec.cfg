// ===== RESET SURF CONFIG VALUES TO DEFAULTS =====
// (Undoes anything surf.cfg changes)
sv_cheats 0
cl_draw_only_deathnotices 0
cl_drawhud_force_deathnotices 0
cl_drawhud_force_crosshair 0
hud_showtargetid 1
cl_teammate_colors_show 1
cl_teamid_overhead_always 0
cl_autohelp 1

// Audio settings
volume "0.58";
sensitivity "0.95";
snd_musicvolume "0";
snd_menumusic_volume "0";
snd_roundstart_volume "0";
snd_roundaction_volume "0";
snd_roundend_volume "0";
snd_mapobjective_volume "1";
snd_tensecondwarning_volume "1";
snd_mvp_volume "0.5";
snd_deathcamera_volume "0.1";
snd_mixahead "0.05";
snd_headphone_pan_exponent "1.05";
snd_rear_headphone_position "90";
snd_front_headphone_position "45.0";
voice_scale "0.45";
snd_duckerattacktime "0.5";
snd_duckerreleasetime "2.5";
snd_duckerthreshold "0.15";
snd_ducktovolume "0.55";
snd_mute_losefocus "0";
snd_mute_mvp_music_live_players "0";

// Crosshair settings
cl_crosshairgap "-4";
cl_crosshair_outlinethickness "1";
cl_crosshaircolor_r "0";
cl_crosshaircolor_g "255";
cl_crosshaircolor_b "255";
cl_crosshairalpha "255";
cl_crosshair_dynamic_splitdist "3";
cl_crosshair_recoil "false";
cl_fixedcrosshairgap "3";
cl_crosshaircolor "4";
cl_crosshair_drawoutline "false";
cl_crosshair_dynamic_splitalpha_innermod "0";
cl_crosshair_dynamic_splitalpha_outermod "1";
cl_crosshair_dynamic_maxdist_splitratio "1";
cl_crosshairthickness "1";
cl_crosshairdot "false";
cl_crosshairgap_useweaponvalue "false";
cl_crosshairusealpha "true";
cl_crosshair_t "false";
cl_crosshairstyle "4";
cl_crosshairsize "1";

// Skin-viewing viewmodel: wide FOV with a slightly closer and higher weapon
viewmodel_fov "68";
viewmodel_offset_x "2.5";
viewmodel_offset_y "1";
viewmodel_offset_z "-1.5";
viewmodel_presetpos "0";
cl_viewmodel_shift_left_amt "0";
cl_viewmodel_shift_right_amt "0";
viewmodel_recoil "0";
cl_bob_lower_amt "5";
cl_bobamt_lat "0.1";
cl_bobamt_vert "0.1";
cl_righthand "1";

// Radar/minimap settings
cl_radar_always_centered "0";
cl_radar_scale "0.4";
cl_radar_icon_scale_min "0.6";
cl_radar_rotate "1";
cl_hud_radar_scale "1.15";
cl_radar_square_with_scoreboard "1";

// Movement binds
// r_cleardecals was removed from CS2. Calling it on every movement/attack
// input only produces rejected-command work and can contribute to hitches.
bind "w" "+forward";
bind "a" "+left";
bind "s" "+back";
bind "d" "+right";
bind "ctrl" "+duck";
bind "shift" "+sprint";

// Bhop binds
bind "mwheelup" "+jump";
bind "mwheeldown" "+jump";
bind "space" "+jump";

// Voice and utility binds
bind "mouse4" "+voicerecord";
bind "mouse5" "slot7"; // flashbang
bind "q" "slot8"; // smoke grenade
bind "v" "slot6"; // frag grenade
bind "4" "slot10"; // molotov/incendiary
bind "c" "switchhands";

bind "mouse1" "+attack";

// Net settings
rate "786432";
// CS2s subtick networking and server now control interpolation and command
// cadence. Legacy CS:GO tick-rate overrides are ignored or counterproductive.
mm_dedicated_search_maxping "25";

// HUD & UI - Orange color
hud_scaling "0.85";
cl_showloadout "1";
safezonex "1";
safezoney "1";
cl_hud_color "7";
cl_hud_color_r "255";
cl_hud_color_g "136";
cl_hud_color_b "0";
cl_draw_only_deathnotices "0";
cl_teamid_overhead_mode "2";
hud_showtargetid "1";
cl_sanitize_player_names "0";
cl_show_clan_in_death_notice "1";
cl_teammate_colors_show "1";

// Performance
fps_max "0";
fps_max_ui "120";
engine_low_latency_sleep_after_client_tick "1";
r_drawtracers_firstperson "1";
r_player_visibility_mode "1";

// Buy binds
bind "kp_ins" "buy vest;";
bind "kp_end" "buy ak47; buy m4a1;";
bind "kp_downarrow" "buy awp;";
bind "kp_pgdn" "buy vest; buy vesthelm; buy defuser;";

// Miscellaneous
con_enable "1";
con_allownotify "1";
gameinstructor_enable "0";
cl_use_opens_buy_menu "1";
cl_dm_buyrandomweapons "0";
cl_autohelp "1";
cl_showloadout "1";
cl_show_observer_crosshair "2";
cl_sniper_delay_unscope "0";
spec_show_xray "1";
spec_replay_autostart "1";
closecaption "0";
cl_timeout "30";
tv_nochat "0";
sv_voiceenable "1";
voice_modenable "1";

// Volume control
bind "j" "incrementvar volume 0 1 0.1";
bind "k" "incrementvar volume 0 1 -0.1";

// Weirdness
alias +incvol "incrementvar volume 0 2 0.35;+sprint";
alias -incvol "incrementvar volume 0 2 -0.35;-sprint";
bind shift +incvol;

// Turn 180 deg: bind capslock "yaw 180/(0.022 * sensitivity) 1 1";
bind capslock "yaw 8612.44 1 1";

// Save config
host_writeconfig;
