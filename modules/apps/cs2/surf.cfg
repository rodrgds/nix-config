// Surf config for clean recording
// Usage: exec surf

// Hide HUD elements
cl_drawhud 0
cl_draw_only_deathnotices 0
hud_showtargetid 0
cl_showloadout 0
cl_showpos 0
net_graph 0
r_drawviewmodel 0

// Clean crosshair (minimal dot or hide entirely)
crosshair 0

// Remove weapon
cl_show_equipped_character_for_player_in_hands 0

// Smooth movement settings
sv_airaccelerate 150
sv_maxvelocity 10000
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_staminamax 0
sv_staminalandcost 0
sv_staminajumpcost 0

// FOV for cinematic look
viewmodel_fov 68
fov_cs_debug 110

// Remove chat and killfeed
cl_chatfilters 0

// Disable team/player info
cl_teamid_overhead_mode 0

// Smooth camera
cl_interpolate 1
cl_interp_ratio 2

echo "*** Surf config loaded - clean recording mode ***"