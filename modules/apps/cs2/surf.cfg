// Surf config for clean recording (CS2 - local server with sv_cheats 1)
// Usage: start a local server, then: sv_cheats 1; exec surf

// Enable cheats (needed for most of these)
sv_cheats 1

// ===== HIDE HUD BUT KEEP CROSSHAIR =====
// cl_draw_only_deathnotices 1 hides health, ammo, radar, scoreboard, etc.
// Then we force-disable deathnotices too for a fully clean screen
cl_draw_only_deathnotices 1
cl_drawhud_force_deathnotices -1
// Force crosshair to stay visible
cl_drawhud_force_crosshair 1

// ===== SURF MOVEMENT SETTINGS =====
sv_airaccelerate 150
sv_maxvelocity 10000
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_staminamax 0
sv_staminalandcost 0
sv_staminajumpcost 0
sv_friction 0

// ===== CINEMATIC FOV =====
fov_cs_debug 100

// ===== DISABLE BOTS AND WARMUP =====
bot_kick
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_timelimit 0
mp_restartgame 1

// ===== CLEAN UP VISUALS =====
cl_autohelp 0
cl_showhelp 0
gameinstructor_enable 0
cl_teammate_colors_show 0
cl_teamid_overhead_always 0
hud_showtargetid 0

// ===== OPTIONAL: SMOOTH DEMO RECORDING =====
// To record: record <demoname>
// To stop: stop
// tv_nochat 1

echo "*** Surf config loaded - clean recording mode (local server) ***"
