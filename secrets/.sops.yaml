  - &rgo_desktop age1kh66yknmm78fls7qx8hujmjyprpflq2g44rtrcxd8ln0e4k3m9vqsq8l2h
  - &rgo_vps age1tql9y0e3zjwpjpu5fhekx5l3q6vd9em2rdlle929mqhee5lunausnu2jr9

creation_rules:
  # VPS-specific secrets - encrypted for VPS + your personal machines
  # This allows you to decrypt/edit on your laptop, VPS can read its own secrets
  - path_regex: (vps-secrets\.yaml|vps-secrets_plain\.yaml)$
    key_groups:
      - age:
          - *rgo_vps
          - *rgo_laptop
          - *rgo_desktop
  # Main secrets file - encrypted for personal machines
  - path_regex: (secrets\.yaml|secrets_plain\.yaml)$
    key_groups:
      - age:
          - *rgo_laptop
          - *rgo_desktop
  # Hindsight's shared-memory token is used only on personal machines.
  - path_regex: hindsight-secrets\.yaml$
    key_groups:
      - age:
          - *rgo_laptop
          - *rgo_desktop
